<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scramini</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

:root {
  --bg: #0e0e10;
  --surface: #18181b;
  --border: #3f3f46;
  --text: #fafafa;
  --muted: #a1a1aa;
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --danger: #f87171;
  --success: #4ade80;
  --radius: 8px;
  --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 0 0 auto;
}

#logo { font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; white-space: nowrap; }
#logo span { color: var(--muted); font-weight: 400; }

#url-form { display: flex; gap: 8px; flex: 1; min-width: 0; }

#url-input {
  flex: 1; min-width: 0;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 6px 12px;
  outline: none;
  transition: border-color 0.15s;
}
#url-input:focus { border-color: var(--accent); }
#url-input::placeholder { color: var(--muted); }

#go-btn {
  background: var(--accent);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  padding: 6px 18px;
  transition: background 0.15s;
  white-space: nowrap;
}
#go-btn:hover { background: var(--accent-hover); }
#go-btn:active { transform: scale(0.97); }
#go-btn:disabled { opacity: 0.5; cursor: not-allowed; }

#status-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 4px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--muted);
  flex: 0 0 auto;
  min-height: 26px;
}
#status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background 0.3s; }
#status-dot.ready { background: var(--success); }
#status-dot.loading { background: var(--accent); animation: pulse 1s infinite; }
#status-dot.error { background: var(--danger); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
#status-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#iframe-wrap { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }

#proxy-frame { width: 100%; height: 100%; border: none; display: block; background: #fff; }

#landing {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  background: var(--bg); color: var(--muted); font-size: 12px; text-align: center; padding: 2rem;
}
#landing .big { font-size: 48px; line-height: 1; user-select: none; }
#landing .hint { color: var(--border); font-size: 11px; }
</style>
</head>
<body>

<div id="header">
  <div id="logo">scram<span>proxy</span></div>
  <form id="url-form">
    <input id="url-input" type="text" placeholder="https://example.com" autocomplete="off" spellcheck="false">
    <button id="go-btn" type="submit">Go</button>
  </form>
</div>

<div id="status-bar">
  <div id="status-dot"></div>
  <span id="status-text">Initializing Scramjet...</span>
</div>

<div id="iframe-wrap">
  <div id="landing">
    <div class="big">&#127760;</div>
    <div>Enter a URL above to begin</div>
    <div class="hint">Powered by Scramjet + epoxy/wisp</div>
  </div>
  <iframe id="proxy-frame" width="100%" style="display:none"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/gh/AerialiteLabs/tinyjet-frontend@latest/tinyjet/scramjet.all.js"></script>

const urlInput = document.getElementById('url-input');
const goBtn = document.getElementById('go-btn');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const landing = document.getElementById('landing');
const frame = document.getElementById('proxy-frame');

function setStatus(state, msg) {
  statusDot.className = state;
  statusText.textContent = msg;
}

function base64ToText(b64) {
  const binary = atob(b64.trim());
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

function extractWispUrls(decoded) {
  if (Array.isArray(decoded)) return decoded.map(x => (x || '').toString().trim()).filter(x => x.startsWith('wss://') || x.startsWith('ws://'));
  if (decoded && typeof decoded === 'object') {
    for (const v of Object.values(decoded)) { const f = extractWispUrls(v); if (f.length) return f; }
  }
  return [];
}

async function getWispUrl() {
  try {
    const r = await fetch(WISP_LIST_URL + '?nocache=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('wisp list HTTP ' + r.status);
    const outer = await r.json();
    let b64 = null;
    if (Array.isArray(outer)) b64 = outer.find(x => typeof x === 'string' && x.trim());
    else if (typeof outer === 'string') b64 = outer;
    if (!b64) throw new Error('no base64 in wisp json');
    const decoded = JSON.parse(base64ToText(b64));
    const list = extractWispUrls(decoded);
    if (!list.length) throw new Error('no wss:// urls found');
    return list[0];
  } catch (e) {
    console.warn('[proxy] falling back to default wisp server:', e.message);
    return FALLBACK_WISP;
  }
}

let scramjet;

async function init() {
  try {
    setStatus('loading', 'Loading wisp server list...');
    const wispUrl = await getWispUrl();

    setStatus('loading', 'Setting up Scramjet controller...');
    const { ScramjetController } = $scramjetLoadController();
    scramjet = new ScramjetController({
      files: {
        wasm: "https://cdn.jsdelivr.net/gh/AerialiteLabs/tinyjet-frontend@latest/tinyjet/wasm.wasm",
        all: "https://cdn.jsdelivr.net/gh/AerialiteLabs/tinyjet-frontend@latest/tinyjet/scramjet.all.js",
        sync: "https://cdn.jsdelivr.net/gh/AerialiteLabs/tinyjet-frontend@latest/tinyjet/scramjet.sync.js"
      }
    });
    await scramjet.init();

    setStatus('loading', 'Registering service worker...');
    const swBlob = new Blob([SW_SOURCE], { type: 'text/javascript' });
    const swUrl = URL.createObjectURL(swBlob);
    await navigator.serviceWorker.register(swUrl, { scope: './' });

    setStatus('loading', 'Connecting bare-mux transport...');
    const connection = new BareMux.BareMuxConnection(BARE_WORKER_URL);
    await connection.setTransport("https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport/dist/index.mjs", [{ wisp: wispUrl }]);

    setStatus('ready', 'Ready — ' + wispUrl);
  } catch (e) {
    setStatus('error', 'Init failed: ' + e.message);
    console.error('[proxy] init error:', e);
  }
}

function loadUrl(raw) {
  if (!scramjet) {
    setStatus('error', 'Scramjet is not ready yet');
    return;
  }
  let fixed = raw.trim();
  try {
    fixed = new URL(fixed).toString();
  } catch (e) {
    try {
      const u = new URL('https://' + fixed);
      if (!u.hostname.includes('.')) throw new Error('not a url');
      fixed = u.toString();
    } catch (e2) {
      setStatus('error', 'Invalid URL');
      return;
    }
  }
  landing.style.display = 'none';
  frame.style.display = 'block';
  setStatus('loading', 'Loading ' + fixed + '...');
  frame.src = scramjet.encodeUrl(fixed);
  urlInput.value = fixed;
  setStatus('ready', fixed);
}

document.getElementById('url-form').addEventListener('submit', e => {
  e.preventDefault();
  const val = urlInput.value.trim();
  if (val) loadUrl(val);
});

init();
