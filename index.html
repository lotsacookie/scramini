<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScramProxy</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0e0e10;
  --surface: #18181b;
  --surface2: #27272a;
  --border: #3f3f46;
  --text: #fafafa;
  --muted: #a1a1aa;
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --danger: #f87171;
  --success: #4ade80;
  --radius: 8px;
  --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

#header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

#logo {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: -0.5px;
  white-space: nowrap;
}

#logo span {
  color: var(--muted);
  font-weight: 400;
}

#url-form {
  display: flex;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

#url-input {
  flex: 1;
  min-width: 0;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 6px 12px;
  outline: none;
  transition: border-color 0.15s;
}

#url-input:focus {
  border-color: var(--accent);
}

#url-input::placeholder {
  color: var(--muted);
}

#go-btn {
  background: var(--accent);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  padding: 6px 18px;
  transition: background 0.15s;
  white-space: nowrap;
}

#go-btn:hover { background: var(--accent-hover); }
#go-btn:active { transform: scale(0.97); }
#go-btn:disabled { opacity: 0.5; cursor: not-allowed; }

#status-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 4px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--muted);
  flex-shrink: 0;
  min-height: 26px;
}

#status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
  transition: background 0.3s;
}

#status-dot.ready { background: var(--success); }
#status-dot.loading { background: var(--accent); animation: pulse 1s infinite; }
#status-dot.error { background: var(--danger); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

#status-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#iframe-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#proxy-frame {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  background: #fff;
}

#landing {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: var(--bg);
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  padding: 2rem;
}

#landing .big {
  font-size: 48px;
  line-height: 1;
  user-select: none;
}

#landing .hint {
  color: var(--border);
  font-size: 11px;
}

#overlay-loading {
  position: absolute;
  inset: 0;
  background: rgba(14,14,16,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--muted);
  gap: 8px;
  backdrop-filter: blur(2px);
}

#overlay-loading.active { display: flex; }

.spinner {
  width: 18px;
  height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}

@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="header">
  <div id="logo">scram<span>proxy</span></div>
  <form id="url-form">
    <input id="url-input" type="text" placeholder="https://example.com" autocomplete="off" spellcheck="false">
    <button id="go-btn" type="submit">Go</button>
  </form>
</div>

<div id="status-bar">
  <div id="status-dot"></div>
  <span id="status-text">Initializing wisp transport...</span>
</div>

<div id="iframe-wrap">
  <div id="landing">
    <div class="big">🌐</div>
    <div>Enter a URL above to begin</div>
    <div class="hint">Routes through epoxy/wisp — bypasses CORS &amp; X-Frame-Options</div>
  </div>
  <div id="overlay-loading">
    <div class="spinner"></div>
    <span id="overlay-text">Loading...</span>
  </div>
  <iframe id="proxy-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals" style="display:none"></iframe>
</div>

<script>
(function() {
  const WISP_LIST_URL = 'https://cdn.jsdelivr.net/gh/lotsacookie/kstuff@main/Assets/json/wss.json';
  const EPOXY_MODULE_URL = 'https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-tls/+esm';
  const REQUEST_TIMEOUT = 30000;

  const urlInput = document.getElementById('url-input');
  const goBtn = document.getElementById('go-btn');
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const landing = document.getElementById('landing');
  const overlayLoading = document.getElementById('overlay-loading');
  const overlayText = document.getElementById('overlay-text');
  const frame = document.getElementById('proxy-frame');

  let swReady = false;
  let epoxyClient = null;
  let epoxyBindings = null;
  let wispUrls = [];
  let wispIndex = 0;
  let currentUrl = null;
  let loadGeneration = 0;

  function setStatus(state, msg) {
    statusDot.className = state;
    statusText.textContent = msg;
  }

  function base64ToText(b64) {
    const binary = atob(b64.trim());
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }

  function extractWispUrls(decoded) {
    if (Array.isArray(decoded)) return decoded.map(x => (x||'').toString().trim()).filter(x => x.startsWith('wss://') || x.startsWith('ws://'));
    if (decoded && typeof decoded === 'object') {
      for (const v of Object.values(decoded)) { const f = extractWispUrls(v); if (f.length) return f; }
    }
    return [];
  }

  async function loadWispList() {
    setStatus('loading', 'Fetching wisp server list...');
    const r = await fetch(WISP_LIST_URL + '?nocache=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('wisp list HTTP ' + r.status);
    const outer = await r.json();
    let b64 = null;
    if (Array.isArray(outer)) b64 = outer.find(x => typeof x === 'string' && x.trim());
    else if (typeof outer === 'string') b64 = outer;
    if (!b64) throw new Error('no base64 in wisp json');
    const decoded = JSON.parse(base64ToText(b64));
    const list = extractWispUrls(decoded);
    if (!list.length) throw new Error('no wss:// urls found');
    return list;
  }

  async function getEpoxyBindings() {
    if (epoxyBindings) return epoxyBindings;
    setStatus('loading', 'Loading epoxy transport...');
    const mod = await import(EPOXY_MODULE_URL);
    if (typeof mod.default === 'function') await mod.default();
    if (!mod.EpoxyClient || !mod.EpoxyClientOptions) throw new Error('epoxy bindings missing');
    epoxyBindings = mod;
    return mod;
  }

  async function getClient() {
    if (epoxyClient) return epoxyClient;
    const server = wispUrls[wispIndex % wispUrls.length];
    setStatus('loading', 'Connecting to ' + server + '...');
    const { EpoxyClient, EpoxyClientOptions } = await getEpoxyBindings();
    const opts = new EpoxyClientOptions();
    opts.user_agent = navigator.userAgent;
    epoxyClient = await new EpoxyClient(server, opts);
    return epoxyClient;
  }

  function resetClient() {
    const old = epoxyClient;
    epoxyClient = null;
    wispIndex = (wispIndex + 1) % Math.max(1, wispUrls.length);
    if (old) setTimeout(() => { try { old.free && old.free(); } catch(e){} }, 10000);
  }

  const withTimeout = (p, ms) => new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error('timeout after ' + ms + 'ms')), ms);
    Promise.resolve(p).then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); });
  });

  async function rawFetch(url, opts) {
    const client = await withTimeout(getClient(), 12000);
    try {
      return await withTimeout(client.fetch(url, opts || {}), REQUEST_TIMEOUT);
    } catch(e) {
      if (/websocket|closed|reset|panic|wasm/i.test(e.message||'')) resetClient();
      throw e;
    }
  }

  async function wispFetchFollowingRedirects(url, opts) {
    let currentUrl = url;
    let currentOpts = opts || {};
    for (let i = 0; i < 10; i++) {
      const resp = await rawFetch(currentUrl, currentOpts);
      const status = resp.status;
      if (status >= 300 && status < 400) {
        const loc = resp.headers.get('location');
        if (!loc) return { resp, finalUrl: currentUrl };
        const nextUrl = new URL(loc, currentUrl).href;
        if (status === 303 || ((status === 301 || status === 302) && currentOpts.method && currentOpts.method !== 'GET')) {
          currentOpts = Object.assign({}, currentOpts, { method: 'GET', body: null });
        }
        currentUrl = nextUrl;
        continue;
      }
      return { resp, finalUrl: currentUrl };
    }
    throw new Error('too many redirects');
  }

  function encodeProxyUrl(url) {
    return '/proxy/' + encodeURIComponent(url);
  }

  function rewriteUrl(url, base) {
    try {
      if (!url) return url;
      const t = url.trim();
      if (/^(data:|blob:|javascript:|mailto:|tel:|#)/i.test(t)) return url;
      if (t.startsWith('/proxy/')) return url;
      return encodeProxyUrl(new URL(t, base).href);
    } catch(e) { return url; }
  }

  function rewriteSrcset(value, base) {
    return value.split(',').map(part => {
      const trimmed = part.trim();
      const m = trimmed.match(/^(\S+)(\s+.*)?$/);
      if (!m) return part;
      return rewriteUrl(m[1], base) + (m[2] || '');
    }).join(', ');
  }

  function injectedScript(origin) {
    return '<script>' +
      '(function(){' +
      'var ORIGIN = ' + JSON.stringify(origin) + ';' +
      'function toProxy(u) {' +
      'try {' +
      'if (!u) return u;' +
      'var t = u.trim();' +
      'if (/^(data:|blob:|javascript:|mailto:|tel:|#)/i.test(t)) return u;' +
      'if (t.indexOf("/proxy/") === 0) return u;' +
      'var abs = new URL(t, document.baseURI).href;' +
      'return ORIGIN + "/proxy/" + encodeURIComponent(abs);' +
      '} catch(e) { return u; }' +
      '}' +
      'var _xopen = XMLHttpRequest.prototype.open;' +
      'XMLHttpRequest.prototype.open = function(method, url) {' +
      'var args = Array.prototype.slice.call(arguments);' +
      'args[1] = toProxy(url);' +
      'return _xopen.apply(this, args);' +
      '};' +
      'var _fetch = window.fetch;' +
      'window.fetch = function(input, init) {' +
      'try {' +
      'var url = typeof input === "string" ? input : input.url;' +
      'var proxied = toProxy(url);' +
      'input = typeof input === "string" ? proxied : new Request(proxied, input);' +
      '} catch(e) {}' +
      'return _fetch.call(window, input, init);' +
      '};' +
      'var _winOpen = window.open;' +
      'window.open = function(url) {' +
      'var args = Array.prototype.slice.call(arguments);' +
      'args[0] = toProxy(url);' +
      'return _winOpen.apply(window, args);' +
      '};' +
      'document.addEventListener("click", function(e) {' +
      'var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;' +
      'if (!a) return;' +
      'var href = a.getAttribute("href");' +
      'if (!href || /^(javascript:|#|mailto:|tel:)/i.test(href)) return;' +
      'var proxied = toProxy(href);' +
      'if (proxied !== href) {' +
      'e.preventDefault();' +
      'window.top.location.href = proxied;' +
      '}' +
      '}, true);' +
      'document.addEventListener("submit", function(e) {' +
      'var f = e.target;' +
      'if (!f || f.tagName !== "FORM") return;' +
      'var action = f.getAttribute("action") || document.baseURI;' +
      'f.setAttribute("action", toProxy(action));' +
      '}, true);' +
      '})();' +
      '<\/script>';
  }

  function rewriteHtml(html, base) {
    let out = html;
    out = out.replace(/(<[a-z][a-z0-9]*\b[^>]*\ssrcset=["'])([^"']+)(["'])/gi, (m, pre, val, post) => pre + rewriteSrcset(val, base) + post);
    out = out.replace(/(<[a-z][a-z0-9]*\b[^>]*\s(?:href|src|action|formaction|poster|data)=["'])([^"']+)(["'])/gi, (m, pre, url, post) => pre + rewriteUrl(url, base) + post);
    out = out.replace(/(<meta[^>]+http-equiv=["']refresh["'][^>]+content=["'][^;]*;\s*url=)([^"']+)(["'])/gi, (m, pre, url, post) => pre + rewriteUrl(url, base) + post);
    out = out.replace(/url\(\s*(['"]?)([^)'"]+)\1\s*\)/g, (m, q, u) => 'url(' + q + rewriteUrl(u.trim(), base) + q + ')');
    out = out.replace(/<head([^>]*)>/i, (m, attrs) => '<head' + attrs + '>' + injectedScript(location.origin));
    return out;
  }

  async function loadUrl(rawUrl) {
    let url;
    try {
      if (!/^https?:\/\//i.test(rawUrl)) rawUrl = 'https://' + rawUrl;
      url = new URL(rawUrl);
    } catch(e) {
      setStatus('error', 'Invalid URL');
      return;
    }

    const gen = ++loadGeneration;
    currentUrl = url.href;
    urlInput.value = url.href;
    landing.style.display = 'none';
    overlayLoading.classList.add('active');
    overlayText.textContent = 'Fetching ' + url.hostname + '...';
    goBtn.disabled = true;
    setStatus('loading', 'Fetching ' + url.href);
    frame.style.display = 'block';

    const stale = () => gen !== loadGeneration;

    try {
      const { resp, finalUrl } = await withTimeout(wispFetchFollowingRedirects(url.href, { method: 'GET' }), REQUEST_TIMEOUT);
      if (stale()) return;

      let html = await resp.text();
      if (stale()) return;

      html = rewriteHtml(html, finalUrl);

      const dirBase = new URL('.', finalUrl).href;
      if (!/<base\s/i.test(html)) {
        if (/<head[^>]*>/i.test(html)) {
          html = html.replace(/<head([^>]*)>/i, `<head$1><base href="${dirBase}">`);
        } else {
          html = `<base href="${dirBase}">` + html;
        }
      }

      const doc = frame.contentDocument;
      if (!doc) throw new Error('iframe document unavailable');

      doc.open();
      doc.write(html);
      doc.close();

      setStatus('ready', finalUrl);
      overlayLoading.classList.remove('active');
    } catch(e) {
      if (stale()) return;
      setStatus('error', 'Error: ' + e.message);
      overlayLoading.classList.remove('active');
      const doc = frame.contentDocument;
      if (doc) {
        doc.open();
        doc.write('<html><body style="font-family:monospace;padding:2rem;background:#0e0e10;color:#f87171"><h2>Proxy Error</h2><p>' + e.message + '</p></body></html>');
        doc.close();
      }
    } finally {
      if (!stale()) goBtn.disabled = false;
    }
  }

  document.getElementById('url-form').addEventListener('submit', e => {
    e.preventDefault();
    const val = urlInput.value.trim();
    if (val) loadUrl(val);
  });

  const SW_SOURCE = `

function base64ToText(b64) {

}

function extractWispUrls(decoded) {
  if (Array.isArray(decoded)) {
    return decoded.map(x => (x || '').toString().trim()).filter(x => x.startsWith('wss://') || x.startsWith('ws://'));
  }

async function loadWispList() {
  try {

    if (!r.ok) throw new Error('HTTP ' + r.status);

    let b64 = null;
    if (Array.isArray(outer)) b64 = outer.find(x => typeof x === 'string' && x.trim());
    else if (typeof outer === 'string') b64 = outer;
    if (!b64) throw new Error('no base64 in wisp json');
    const decoded = JSON.parse(base64ToText(b64));
    const list = extractWispUrls(decoded);

  if (typeof mod.default === 'function') await mod.default();

    'if (!a) return;' +
    'var href = a.getAttribute("href");' +
    'if (!href || /^(javascript:|#|mailto:|tel:)/i.test(href)) return;' +
    'var proxied = toProxy(href);' +
    'if (proxied !== href) {' +
    'e.preventDefault();' +
    'window.top.location.href = proxied;' +
    '}' +
    '}, true);' +
    'document.addEventListener("submit", function(e) {' +
    'var f = e.target;' +
    'if (!f || f.tagName !== "FORM") return;' +
    'var action = f.getAttribute("action") || document.baseURI;' +
    'f.setAttribute("action", toProxy(action));' +
    '}, true);' +
    '})();' +
    '<\\/script>';
}

function rewriteContent(text, base, isHtml, isCss) {
  if (isCss) {
    return text.replace(/url\\(\\s*(['"]?)([^)'"]+)\\1\\s*\\)/g, (m, q, u) => 'url(' + q + rewriteUrl(u.trim(), base) + q + ')')
      .replace(/@import\\s+(['"])([^'"]+)\\1/g, (m, q, u) => '@import ' + q + rewriteUrl(u, base) + q);
  }

  if (isHtml) {
    let out = text;
    out = out.replace(/(<[a-z][a-z0-9]*\\b[^>]*\\ssrcset=["'])([^"']+)(["'])/gi, (m, pre, val, post) => pre + rewriteSrcset(val, base) + post);
    out = out.replace(/(<[a-z][a-z0-9]*\\b[^>]*\\s(?:href|src|action|formaction|poster|data)=["'])([^"']+)(["'])/gi, (m, pre, url, post) => pre + rewriteUrl(url, base) + post);
    out = out.replace(/(<meta[^>]+http-equiv=["']refresh["'][^>]+content=["'][^;]*;\\s*url=)([^"']+)(["'])/gi, (m, pre, url, post) => pre + rewriteUrl(url, base) + post);
    out = out.replace(/url\\(\\s*(['"]?)([^)'"]+)\\1\\s*\\)/g, (m, q, u) => 'url(' + q + rewriteUrl(u.trim(), base) + q + ')');
    const dirBase = new URL('.', base).href;
    out = out.replace(/<head([^>]*)>/i, (m, attrs) => '<head' + attrs + '><base href="' + dirBase + '">' + injectedScript(self.location.origin));
    return out;
  }

  return text;
}

self.addEventListener('install', e => { e.waitUntil(self.skipWaiting()); });

self.addEventListener('activate', e => {
  e.waitUntil(self.clients.claim());
  loadWispList().then(urls => { wispUrls = urls; });
  getClient().catch(e => console.warn('[sw] initial client setup:', e.message));
});

async function handleProxyRequest(targetUrl, originalRequest) {
  const headers = {};
  for (const [k, v] of originalRequest.headers.entries()) {
    const kl = k.toLowerCase();
    if (kl === 'host' || kl === 'origin' || kl === 'referer' || kl === 'cookie') continue;
    headers[k] = v;
  }
  headers['Origin'] = new URL(targetUrl).origin;

  let body = null;
  if (originalRequest.method !== 'GET' && originalRequest.method !== 'HEAD') {
    try { body = await originalRequest.arrayBuffer(); } catch (e) {}
  }

  const { resp, finalUrl } = await fetchFollowingRedirects(targetUrl, { method: originalRequest.method, headers, body });

  const contentType = resp.headers.get('content-type') || '';
  const isHtml = contentType.includes('text/html');
  const isCss = contentType.includes('text/css');

  const respHeaders = new Headers();
  respHeaders.set('Access-Control-Allow-Origin', '*');
  respHeaders.set('Access-Control-Allow-Methods', '*');
  for (const [k, v] of resp.headers.entries()) {
    const kl = k.toLowerCase();
    if (kl === 'content-security-policy' || kl === 'x-frame-options' || kl === 'content-encoding' || kl === 'set-cookie' || kl === 'location') continue;
    respHeaders.set(k, v);
  }

  if (isHtml || isCss) {
    const text = await resp.text();
    const rewritten = rewriteContent(text, finalUrl, isHtml, isCss);
    return new Response(rewritten, { status: resp.status, headers: respHeaders });
  }

  const blob = await resp.blob();
  return new Response(blob, { status: resp.status, headers: respHeaders });
}

self.addEventListener('fetch', e => {
  const url = new URL(e.request.url);
  if (!url.pathname.startsWith(PROXY_PREFIX)) return;

  const encoded = url.pathname.slice(PROXY_PREFIX.length) + url.search;
  let targetUrl;
  try {
    targetUrl = decodeURIComponent(encoded);
    new URL(targetUrl);
  } catch (err) {
    e.respondWith(new Response('Bad proxy URL', { status: 400 }));
    return;
  }

  e.respondWith(
    handleProxyRequest(targetUrl, e.request).catch(err => {
      console.error('[sw] proxy error:', err);
      return new Response(
        '<h2 style="font-family:monospace;padding:2rem">Proxy error: ' + err.message + '</h2>',
        { status: 502, headers: { 'content-type': 'text/html' } }
      );
    })
  );
});
`;

  async function init() {
    try {
      wispUrls = await loadWispList();
      setStatus('loading', 'Connecting to wisp: ' + (wispUrls[0] || '?'));
      await getClient();
      setStatus('ready', 'Ready — ' + wispUrls[wispIndex % wispUrls.length]);

      if ('serviceWorker' in navigator) {
        try {
          const swBlob = new Blob([SW_SOURCE], { type: 'text/javascript' });
          const swUrl = URL.createObjectURL(swBlob);
          const reg = await navigator.serviceWorker.register(swUrl, { scope: './' });
          await new Promise(res => {
            if (reg.active) { swReady = true; return res(); }
            const w = reg.installing || reg.waiting;
            if (w) w.addEventListener('statechange', function() { if (this.state === 'activated') { swReady = true; res(); } });
            else reg.addEventListener('updatefound', () => {
              reg.installing.addEventListener('statechange', function() { if (this.state === 'activated') { swReady = true; res(); } });
            });
            setTimeout(res, 3000);
          });
          console.log('[proxy] service worker registered');
        } catch(e) {
          console.warn('[proxy] SW registration failed (sub-resource rewrite via SW disabled):', e.message);
        }
      }
    } catch(e) {
      setStatus('error', 'Init failed: ' + e.message);
      console.error('[proxy] init error:', e);
    }
  }

  init();
})();
</script>
